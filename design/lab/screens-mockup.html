<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thru screens mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --page: #EFEBE0; --page-ink: #2B1F1A; --page-sub: #6E6058; --seg: rgba(43,31,26,.07);
  --paper: #F9F6ED; --card: #FFFDF8; --ink: #2B1F1A; --ink60: rgba(43,31,26,.6); --hair: rgba(43,31,26,.08); --track: rgba(43,31,26,.10);
  --salmon: #F07B62; --push: #33B378; --moderate: #EDAB2E; --recover: #DB454C;
  --sleep: #9470F2; --strain: #2978F2; --heart: #21A8BD; --body: #F29433; --nutrition: #E3598F; --air: #6BBDDB;
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #141110; --page-ink: #F9F6ED; --page-sub: #B5A99F; --seg: rgba(249,246,237,.08); }
}
:root[data-theme="dark"] { --page: #141110; --page-ink: #F9F6ED; --page-sub: #B5A99F; --seg: rgba(249,246,237,.08); }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
html, body { margin: 0; }
body { background: var(--page); color: var(--page-ink); font-family: var(--sys); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 40px 16px 64px; }
h1 { font-size: 28px; line-height: 36px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
.lede { color: var(--page-sub); font-size: 16px; line-height: 24px; margin: 0 0 24px; max-width: 720px; }
.bar-top { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 12px 0; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.nav a { font: 500 14px/20px var(--sys); color: var(--page-ink); text-decoration: none; padding: 8px 12px; border-radius: 12px; background: var(--seg); }
.nav a:hover, .nav a:focus-visible { background: var(--page-ink); color: var(--page); outline: none; }
.seg { display: inline-flex; background: var(--seg); border-radius: 12px; }
.seg button { font: 500 14px/20px var(--sys); color: var(--page-ink); background: none; border: 0; padding: 8px 14px; border-radius: 12px; cursor: pointer; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--page-ink); color: var(--page); }
.seg button:focus-visible { outline: 2px solid var(--salmon); outline-offset: 2px; }
.ctl-label { font-size: 13px; color: var(--page-sub); margin-right: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(390px, 100%), 1fr)); gap: 48px 32px; justify-items: center; }
.block { width: 100%; max-width: 390px; scroll-margin-top: 80px; }
.block.wide { grid-column: 1 / -1; max-width: none; }
.block h2 { font-size: 17px; line-height: 24px; font-weight: 600; margin: 0 0 4px; }
.block .tag { color: var(--page-sub); font-size: 14px; line-height: 20px; margin: 0 0 16px; }
.notes { font-size: 14px; line-height: 20px; color: var(--page-sub); padding-left: 18px; margin: 20px 0 0; }
.notes li { margin-bottom: 6px; }

/* ---------- Phone ---------- */
.phone { width: 100%; max-width: 390px; border-radius: 48px; border: 10px solid #15110F; position: relative; overflow: clip; background: var(--paper); color: var(--ink); box-shadow: 0 30px 60px -30px rgba(0,0,0,.45); }
.screen { position: relative; min-height: 824px; display: flex; flex-direction: column; }
.glows { position: absolute; inset: 0 0 auto 0; height: 900px; pointer-events: none; overflow: hidden; }
.glows i { position: absolute; border-radius: 50%; transition: background .8s ease; }
.glows .g1 { width: 380px; height: 380px; left: -120px; top: -100px; }
.glows .g2 { width: 320px; height: 320px; right: -140px; top: 180px; background: radial-gradient(closest-side, rgba(252,194,84,.20), rgba(252,194,84,0)); }
.glows .g3 { width: 340px; height: 340px; left: -60px; top: 540px; background: radial-gradient(closest-side, rgba(247,128,51,.12), rgba(247,128,51,0)); }
.content { position: relative; padding: 52px 24px 24px; flex: 1; }
.status { position: absolute; top: 14px; left: 30px; right: 30px; display: flex; justify-content: space-between; font: 600 15px/20px var(--sys); z-index: 1; }
.status .sig { display: flex; gap: 4px; align-items: center; }
.status .sig b { width: 16px; height: 10px; background: var(--ink); display: block; border-radius: 2px; }
.status .sig b:first-child { width: 14px; border-radius: 0; clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.navrow { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 12px; font-size: 17px; color: var(--ink); min-height: 24px; }
.navrow .back { display: inline-flex; align-items: center; gap: 6px; }
.navrow svg { width: 12px; height: 20px; }
.title { font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.015em; margin: 12px 0 24px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; margin: 12px 0 24px; }
.head .wm { height: 24px; display: block; }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: 24px; padding: 24px; margin-bottom: 24px; position: relative; }
.card.tight { padding: 12px; }
.plain { margin-bottom: 24px; }
.label { font-size: 13px; line-height: 18px; color: var(--ink60); }
.heading { font-size: 17px; line-height: 24px; font-weight: 600; margin: 0 0 12px; }
.heading + .label { margin: -8px 0 12px; }
.body { font-size: 17px; line-height: 24px; margin: 0 0 12px; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; }
.score { font-size: 48px; line-height: 48px; letter-spacing: -0.02em; }
.value { font-size: 22px; line-height: 24px; }
.unit { font-size: 13px; font-weight: 400; color: var(--ink60); margin-left: 2px; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; display: inline-block; }
.zone { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; line-height: 20px; font-weight: 500; }
.advice { font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.015em; margin: 24px 0 0; }
.hero { display: flex; gap: 24px; align-items: center; }
.tile { display: block; flex: none; }
.tile .bg { transition: fill .6s ease; }
.pseg { display: flex; background: rgba(43,31,26,.06); border-radius: 12px; margin-bottom: 24px; }
.pseg span { flex: 1; text-align: center; font-size: 13px; line-height: 18px; font-weight: 500; padding: 7px 0; border-radius: 12px; }
.pseg span.on { background: var(--ink); color: var(--paper); }
.split { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.two .card { margin: 0; }

/* Bars */
.bars { display: grid; gap: 12px; }
.barrow { display: grid; grid-template-columns: 84px 1fr minmax(44px, auto); align-items: center; gap: 12px; }
.barrow .v { text-align: right; font-size: 17px; line-height: 24px; }
.track { height: 12px; background: var(--track); position: relative; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width .6s ease, background .6s ease; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); margin-left: -1px; }
.band { position: absolute; top: 0; bottom: 0; background: rgba(41,120,242,.18); }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; min-height: 48px; border-top: 1px solid var(--hair); padding: 12px 0; }
.row:first-child { border-top: 0; padding-top: 0; }
.row:last-child { padding-bottom: 0; }
.row .r { text-align: right; }
.row .main { font-size: 17px; line-height: 24px; }
.row .withdot { display: grid; grid-template-columns: 6px 1fr; gap: 12px; align-items: baseline; }
.row .withdot .dot { transform: translateY(-3px); }
.why { display: grid; gap: 12px; }
.why div { display: grid; grid-template-columns: 6px 1fr; gap: 12px; align-items: baseline; font-size: 15px; line-height: 22px; }
.why .dot { transform: translateY(-2px); }
.chart { display: flex; align-items: flex-end; gap: 3px; height: 96px; position: relative; }
.chart.g6 { gap: 6px; }
.chart b { flex: 1; display: block; position: relative; z-index: 1; }
.chart .line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ink); z-index: 2; }
.chart .bandh { position: absolute; left: 0; right: 0; height: 12px; background: rgba(41,120,242,.16); z-index: 0; }
.chart .tk { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--ink); }
.axis { display: flex; justify-content: space-between; margin-top: 6px; }
.gridl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hair); }
.stack { display: flex; height: 12px; }
.stack i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; line-height: 18px; color: var(--ink60); }
.legend i { width: 12px; height: 12px; display: inline-block; }
.streak { display: flex; gap: 6px; margin-top: 12px; }
.streak span { flex: 1; height: 24px; background: rgba(43,31,26,.08); }
.streak span.on { background: var(--sleep); }
.cta { display: block; width: 100%; min-height: 48px; border: 0; font: 600 17px/24px var(--sys); color: var(--ink); background: var(--salmon); border-radius: 24px; }
.ghost { display: block; width: 100%; min-height: 48px; font: 600 17px/24px var(--sys); color: var(--ink); background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9); border-radius: 24px; box-shadow: 0 6px 18px -8px rgba(43,31,26,.25); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.sq { width: 24px; height: 24px; flex: none; display: grid; place-items: center; }
.sq svg { width: 14px; height: 14px; fill: #fff; }
.irow { display: grid; grid-template-columns: 24px 1fr 12px; gap: 12px; align-items: center; min-height: 48px; border-top: 1px solid var(--hair); padding: 12px 0; }
.irow:first-child { border-top: 0; padding-top: 0; }
.irow:last-child { padding-bottom: 0; }
.chev { width: 8px; height: 14px; stroke: rgba(43,31,26,.35); fill: none; stroke-width: 2; }
.footnote { font-size: 13px; line-height: 18px; color: var(--ink60); margin: -12px 0 24px; padding: 0 12px; }
.secthead { font-size: 13px; line-height: 18px; color: var(--ink60); margin: 0 0 6px 12px; }

/* Tab bar: system glass */
.tabbar { position: sticky; bottom: 16px; margin: 0 16px 20px; height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 8px 24px -8px rgba(43,31,26,.25); z-index: 3; }
.tabbar a { display: grid; justify-items: center; gap: 2px; font-size: 10px; line-height: 12px; font-weight: 500; color: rgba(43,31,26,.45); text-decoration: none; padding: 6px 0; }
.tabbar a.on { color: var(--ink); }
.tabbar svg { width: 24px; height: 24px; fill: currentColor; }

/* Watch and widgets */
.stage { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; padding: 40px 16px; border-radius: 24px; background: #E6DFD0; }
.stage.dark { background: #1C1714; }
.stagewrap { display: grid; gap: 24px; }
.figure { display: grid; justify-items: center; gap: 12px; }
.figure .cap { font-size: 13px; line-height: 18px; color: var(--page-sub); }
.stage .figure .cap { color: rgba(43,31,26,.6); }
.stage.dark .figure .cap { color: rgba(249,246,237,.6); }
.watch { width: 208px; height: 250px; border-radius: 56px; background: #2A2624; padding: 10px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.6), inset 0 0 0 2px #3A3532; position: relative; }
.watch::after { content: ""; position: absolute; right: -8px; top: 64px; width: 8px; height: 40px; background: #3A3532; border-radius: 0 4px 4px 0; }
.wscreen { width: 100%; height: 100%; border-radius: 46px; background: #000; color: #F9F6ED; padding: 18px 18px; display: flex; flex-direction: column; }
.wtime { font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; text-align: right; }
.wlabel { font-size: 12px; line-height: 16px; color: rgba(249,246,237,.6); }
.wrow { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
.wbar { height: 6px; background: rgba(249,246,237,.18); position: relative; margin-top: 4px; }
.wbar i { position: absolute; left: 0; top: 0; bottom: 0; }
.widget { background: var(--card); color: var(--ink); border-radius: 24px; padding: 16px; box-shadow: 0 10px 30px -14px rgba(43,31,26,.35); }
.widget.small { width: 158px; height: 158px; display: flex; flex-direction: column; justify-content: space-between; }
.widget.medium { width: 338px; max-width: 100%; height: 158px; display: grid; grid-template-columns: 76px 1fr; gap: 16px; align-items: center; }
.widget .bars { gap: 8px; }
.widget .barrow { grid-template-columns: 60px 1fr 32px; gap: 8px; }
.widget .barrow .v { font-size: 15px; }
.widget .track { height: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>thru, every screen</h1>
  <p class="lede">The whole app on the thru system in the flat style: solid cards, square-ended bars, one face per screen, glass only on the tab bar. Content follows the current views. Demo data only.</p>
  <div class="bar-top">
    <nav class="nav" aria-label="Screens">
      <a href="#today">Today</a><a href="#sleep">Sleep</a><a href="#trends">Trends</a><a href="#workouts">Workouts</a><a href="#workout">Workout detail</a><a href="#nutrition">Nutrition</a><a href="#info">Info</a><a href="#explain">Recovery explained</a><a href="#watch">Watch and widgets</a>
    </nav>
    <div><span class="ctl-label">Recovery</span>
      <div class="seg" role="group" aria-label="Recovery state">
        <button type="button" data-state="push" aria-pressed="true">Push</button>
        <button type="button" data-state="moderate" aria-pressed="false">Moderate</button>
        <button type="button" data-state="recover" aria-pressed="false">Recover</button>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

      '<div class="card">' + irow("Recovery", COL.push, "HRV, resting HR and sleep against your usual", I.ecg) + irow("Sleep score", COL.sleep, "Six markers, 100 points", I.bed) + irow("Strain", COL.strain, "Heart rate effort across the day", I.lift) + irow("Food quality", COL.nutrition, "Limits, protein and fibre", I.fork) + '</div>', COL.heart),
    ["Grouped lists become flat cards with 48 pt rows and square colour badges.", "Each badge carries its area colour; text stays ink."]));

  S.push(block("explain", "Recovery explained", "Explanations: a score page opens with its face",
    phone("info",
      '<div class="navrow"><span class="back">' + BACK + 'Info</span></div>' +
      '<div class="plain"><div class="hero">' + face({ size: 72, col: COL.push, t: 1, label: "Push face" }) + '<div><div class="title" style="margin:0">Recovery</div><div class="label">0 to 100, every morning</div></div></div></div>' +
      '<p class="body">Recovery compares last night\'s HRV and resting heart rate with your usual for the last 4 weeks, then adds how well you slept.</p>' +
      card(heading("What goes in") + '<div class="bars">' + sbar("HRV", 50, COL.heart, "50%") + sbar("Resting HR", 25, COL.heart, "25%") + sbar("Sleep", 25, COL.sleep, "25%") + '</div>') +
      card(heading("Zones") + '<div class="rows">' + [["push", "Push", "from 67"], ["moderate", "Moderate", "34 to 66"], ["recover", "Recover", "below 34"]]
        .map(function (z) { return '<div class="row"><span class="withdot"><span class="dot" style="background:var(--' + z[0] + ')"></span><span class="main">' + z[1] + '</span></span><span class="r num" style="font-size:17px">' + z[2] + '</span></div>'; }).join("") + '</div>') +
      card(heading("This morning") + '<div class="why">' + [["push", "HRV 62 ms against your usual 54 ms: 15% above."], ["moderate", "Resting HR 52 bpm, the same as usual."], ["push", "Sleep score 84."]]
        .map(function (w) { return '<div><span class="dot" style="background:var(--' + w[0] + ')"></span><span>' + w[1] + '</span></div>'; }).join("") + '</div>' +
        '<div class="split" style="margin-top:24px"><span class="label">Recovery</span><span class="value num">78</span></div>'), COL.push),
    ["The one face on this screen opens the page, then the formula in Body text.", "Weights are score bars, so the maths reads at a glance."]));
})();

// Watch and widgets
S.push(block("watch", "Watch and widgets", "HealthWatch complications and home screen widgets",
  '<div class="stagewrap"><div class="stage dark">' +
    '<div class="figure"><div class="watch"><div class="wscreen"><div class="wtime">09:41</div><div class="wrow">' + face({ size: 56, col: COL.push, t: 1, live: true, label: "Recovery 78, push" }) +
      '<div><div class="num" style="font-size:28px;line-height:30px" data-live="rec">78</div><div class="wlabel" data-live="word">Push</div></div></div>' +
      '<div style="margin-top:12px"><div class="wlabel">Sleep 84</div><div class="wbar"><i style="width:84%;background:' + COL.sleep + '"></i></div><div class="wlabel" style="margin-top:6px">Strain <span data-live="strainv">11.2</span></div><div class="wbar"><i data-live="wstrain" style="width:53%;background:' + COL.strain + '"></i></div></div></div></div><div class="cap">Day face: the mood face is the complication</div></div>' +
    '<div class="figure"><div class="watch"><div class="wscreen"><div class="wtime" style="color:rgba(249,246,237,.7)">02:14</div><div class="wrow">' + face({ size: 56, col: COL.sleep, t: .4, eyes: "asleep", label: "Asleep" }) +
      '<div><div class="num" style="font-size:22px;line-height:26px">06:45</div><div class="wlabel">Alarm, smart window 30 min</div></div></div>' +
      '<div style="margin-top:12px"><div class="wlabel">Asleep 3 h 02 min</div><div class="wbar"><i style="width:40%;background:' + COL.sleep + '"></i></div></div></div></div><div class="cap">Night face: Asleep, during the sleep window</div></div>' +
  '</div><div class="stage">' +
    '<div class="figure"><div class="widget small">' + face({ size: 56, col: COL.push, t: 1, live: true, label: "Recovery 78, push" }) + '<div><div class="score num" style="font-size:34px;line-height:36px" data-live="rec">78</div><div class="zone" style="font-size:13px"><span class="dot" data-live="zdot" style="background:var(--push)"></span><span data-live="word">Push</span></div></div></div><div class="cap">Small</div></div>' +
    '<div class="figure"><div class="widget medium">' + face({ size: 76, col: COL.push, t: 1, live: true, label: "Recovery 78, push" }) + '<div class="bars">' +
      sbar("Sleep", 84, COL.sleep, '<span data-live="sleepv">84</span>', null, ' data-live="sleepb"') + sbar("Recovery", 78, COL.push, '<span data-live="recv">78</span>', null, ' data-live="recb"') + sbar("Strain", 53, COL.strain, '<span data-live="strainv">11.2</span>', null, ' data-live="strainb"') +
    '</div></div><div class="cap">Medium</div></div>' +
    '<div class="figure"><div class="widget small" style="justify-content:center;align-items:center;gap:12px">' + face({ size: 56, col: COL.nutrition, t: 1, eyes: "wink", label: "Saved" }) + '<div class="label" style="text-align:center">Lunch saved<br>640 kcal</div></div><div class="cap">Saved: wink, in the area colour</div></div>' +
    '<div class="figure"><div class="widget small" style="justify-content:center;align-items:center;gap:12px">' + face({ size: 56, col: COL.strain, t: 1, eyes: "record", label: "New record" }) + '<div class="label" style="text-align:center">New record<br>Back squat 127.5 kg</div></div><div class="cap">New record: half circle eyes</div></div>' +
  '</div></div>',
  ["One face per surface. The day face and widgets follow the recovery switch; Asleep, Saved and New record are fixed states.", "On the watch, colour sits only in the tile and the bars; all text is paper."], true));

document.getElementById("grid").innerHTML = S.join("");

// ---------- State switch ----------
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches, curT = 1, anim = null;
function setMouth(t) { var d = mouth(t); document.querySelectorAll(".tile.live .mouth").forEach(function (m) { m.setAttribute("d", d); }); }
function morphTo(t) {
  if (anim) cancelAnimationFrame(anim);
  if (reduce) { curT = t; setMouth(t); return; }
  var from = curT, t0 = performance.now();
  (function step(now) { var p = Math.min(1, (now - t0) / 600), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; curT = from + (t - from) * e; setMouth(curT); if (p < 1) anim = requestAnimationFrame(step); })(t0);
}
function all(k) { return document.querySelectorAll('[data-live="' + k + '"]'); }
function render(key) {
  var s = STATES[key], zc = "var(--" + key + ")";
  document.querySelectorAll(".tile.live").forEach(function (t) { t.querySelector(".bg").setAttribute("fill", s.col); t.setAttribute("aria-label", "Recovery " + s.rec + ", " + s.word.toLowerCase()); });
  all("rec").forEach(function (e) { e.textContent = s.rec; }); all("recv").forEach(function (e) { e.textContent = s.rec; });
  all("word").forEach(function (e) { e.textContent = s.word; }); all("zdot").forEach(function (e) { e.style.background = zc; });
  all("advice").forEach(function (e) { e.textContent = s.advice; });
  all("sleepv").forEach(function (e) { e.textContent = s.sleep; }); all("strainv").forEach(function (e) { e.textContent = s.strain.toFixed(1); });
  all("sleepb").forEach(function (e) { e.querySelector(".fill").style.width = s.sleep + "%"; });
  all("recb").forEach(function (e) { var f = e.querySelector(".fill"); f.style.width = s.rec + "%"; f.style.background = zc; });
  all("strainb").forEach(function (e) { e.querySelector(".fill").style.width = (s.strain / 21 * 100) + "%"; var t = e.querySelector(".tick"); if (t) t.style.left = (s.target / 21 * 100) + "%"; });
  all("wstrain").forEach(function (e) { e.style.width = (s.strain / 21 * 100) + "%"; });
  all("why").forEach(function (e) { e.innerHTML = s.why.map(function (w) { return '<div><span class="dot" style="background:var(--' + w[0] + ')"></span><span>' + w[1] + '</span></div>'; }).join(""); });
  document.querySelectorAll(".liveglow").forEach(function (g) { g.style.background = "radial-gradient(closest-side," + rgba(s.col, .18) + ",rgba(0,0,0,0))"; });
  morphTo(s.t);
}
document.querySelectorAll(".seg button").forEach(function (b) {
  b.addEventListener("click", function () { document.querySelectorAll(".seg button").forEach(function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); }); render(b.dataset.state); });
});
render("push");

// Blink on Today only, every 3 to 5 s
function blink() {
  if (reduce) return; var t0 = performance.now();
  (function step(now) { var p = Math.min(1, (now - t0) / 240), lid = Math.sin(p * Math.PI);
    document.querySelectorAll(".eye.blink").forEach(function (e) { e.setAttribute("y", 30 * lid * .9); e.setAttribute("height", 30 * (1 - lid * .9)); });
    if (p < 1) requestAnimationFrame(step); else setTimeout(blink, 3000 + Math.random() * 2000); })(t0);
}
setTimeout(blink, 2500);
</script>
</body>
</html>
