<rect x="60" y="964" width="900" height="18" fill="#EFE8DA"/>
<text x="1000" y="960" font-size="16" font-weight="600" fill="#2B1F1A">e  One line through both</text><text x="1000" y="981" font-size="13" fill="#7A6A5C">Heart and word on the same 7-module grid,</text>
<text x="1000" y="1002" font-size="13" fill="#7A6A5C">so a single cut runs through the whole lockup</text>
