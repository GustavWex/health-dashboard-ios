<rect x="-110" y="75" width="220" height="25" fill="#E8553F"/></g>
<text x="540" y="792" font-size="16" font-weight="600" fill="#2B1F1A">c  Reversed</text><text x="540" y="813" font-size="13" fill="#7A6A5C">Paper heart on coral, app icon</text>
<rect x="790" y="542" width="220" height="220" rx="49.5" fill="#EFE8DA"/>
