<text x="1040" y="410" font-size="16" font-weight="600" fill="#2B1F1A">e  In the wordmark</text><text x="1040" y="431" font-size="13" fill="#7A6A5C">Only the u in colour</text>
<text x="40" y="520" font-size="20" font-weight="600" fill="#2B1F1A">2  A heart from the cut and the u</text>
<rect x="40" y="542" width="220" height="220" rx="49.5" fill="#EFE8DA"/>
<g transform="translate(150 575.528) scale(0.873967)">
<path d="M0 156.066 L-70.711 85.355 A50 50 0 0 1 0 14.645 A50 50 0 0 1 70.711 85.355 Z" fill="#E8553F"/>
<rect x="-110" y="75" width="220" height="25" fill="#EFE8DA"/></g>
