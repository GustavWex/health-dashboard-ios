<g transform="translate(400 575.528) scale(0.873967)">
<path d="M0 138.388 L-53.033 85.355 A37.5 37.5 0 0 1 0 32.322 A37.5 37.5 0 0 1 53.033 85.355 Z" fill="none" stroke="#E8553F" stroke-width="25" stroke-miterlimit="4"/>
<rect x="-110" y="75" width="220" height="25" fill="#EFE8DA"/></g>
<text x="290" y="792" font-size="16" font-weight="600" fill="#2B1F1A">b  u-bowl heart</text><text x="290" y="813" font-size="13" fill="#7A6A5C">Each lobe is the u bowl turned over</text>
