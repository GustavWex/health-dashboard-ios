<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1180" viewBox="0 0 1400 1180" font-family="Inter">
<rect width="1400" height="1180" fill="#F9F6ED"/>
<text x="40" y="60" font-size="28" font-weight="600" fill="#2B1F1A">Two logo ideas from the wordmark</text>
<text x="40" y="118" font-size="20" font-weight="600" fill="#2B1F1A">1  The u is a smiley</text>
<rect x="40" y="140" width="220" height="220" rx="49.5" fill="#EFE8DA"/>
<g transform="translate(88.62 127.24) scale(1.0912)" fill="#2B1F1A"><path d="M0 50 H31.25 V75 H0 Z M81.25 50 H112.5 V75 H81.25 Z"/><path d="M0 100 H31.25 V125 A25 25 0 0 0 81.25 125 V100 H112.5 V125 A50 50 0 0 1 62.5 175 H50 A50 50 0 0 1 0 125 Z"/></g>
<text x="40" y="390" font-size="16" font-weight="600" fill="#2B1F1A">a  As drawn</text><text x="40" y="411" font-size="13" fill="#7A6A5C">Stubs are the eyes, the cut is the gap</text>
<rect x="290" y="140" width="220" height="220" rx="49.5" fill="#EFE8DA"/>
<g transform="translate(338.62 127.24) scale(1.0912)" fill="#2B1F1A"><circle cx="15.625" cy="62.5" r="15.625"/><circle cx="96.875" cy="62.5" r="15.625"/><path d="M0 100 H31.25 V125 A25 25 0 0 0 81.25 125 V100 H112.5 V125 A50 50 0 0 1 62.5 175 H50 A50 50 0 0 1 0 125 Z"/></g>
<text x="290" y="390" font-size="16" font-weight="600" fill="#2B1F1A">b  Round eyes</text><text x="290" y="411" font-size="13" fill="#7A6A5C">Eyes become dots, 1 stroke wide</text>
<rect x="540" y="140" width="220" height="220" rx="49.5" fill="#E8553F"/>
<g transform="translate(588.62 127.24) scale(1.0912)" fill="#F9F6ED"><path d="M0 56.25 H31.25 V68.75 H0 Z M81.25 50 H112.5 V75 H81.25 Z"/><path d="M0 100 H31.25 V125 A25 25 0 0 0 81.25 125 V100 H112.5 V125 A50 50 0 0 1 62.5 175 H50 A50 50 0 0 1 0 125 Z"/></g>
<text x="540" y="390" font-size="16" font-weight="600" fill="#2B1F1A">c  Wink</text><text x="540" y="411" font-size="13" fill="#7A6A5C">Half-height eye, for done and saved</text>
<rect x="790" y="140" width="140" height="140" rx="31.5" fill="#3DAA6B"/>
<g transform="translate(820.94 131.88) scale(0.6944)" fill="#FFFFFF"><path d="M0 50 H31.25 V75 H0 Z M81.25 50 H112.5 V75 H81.25 Z"/><path d="M0 100 H31.25 V125 A25 25 0 0 0 81.25 125 V100 H112.5 V125 A50 50 0 0 1 62.5 175 H50 A50 50 0 0 1 0 125 Z"/></g>
