<rect x="800" y="639.143" width="200" height="25.7143" fill="#EFE8DA"/>
<text x="790" y="792" font-size="16" font-weight="600" fill="#2B1F1A">d  Glass icon, cut</text><text x="790" y="813" font-size="13" fill="#7A6A5C">The current heart with the same slit</text>
