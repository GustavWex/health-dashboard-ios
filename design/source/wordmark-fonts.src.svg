  <text id="w3" x="1288" y="310" font-family="Space Grotesk" font-size="170" font-weight="700" letter-spacing="-6.80" text-anchor="middle" fill="#2B1F1A">thru</text>
  <text x="1084" y="410" font-size="18" font-weight="600" fill="#2B1F1A">3  Space Grotesk Bold</text><text x="1084" y="434" font-size="15" fill="#7A6A5C">Quirky details in t and r</text>
