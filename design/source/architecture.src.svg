  <circle cx="108" cy="364" r="7" fill="#F29433"/>
  <text x="128" y="371" font-size="20" fill="#2B1F1A">Any smart scale app</text>
  <rect id="card-food" x="80" y="406" width="360" height="60" rx="18" fill="#FFFFFF" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="1.5"/>
  <circle cx="108" cy="436" r="7" fill="#E3598F"/>
