    <path d="M870 470l-10 -6v12z"/>
    <path d="M870 570l-10 -6v12z"/>
    <path d="M1294 400l-10 -6v12z"/>
    <path d="M1294 520l-10 -6v12z"/>
    <path d="M1294 640l-10 -6v12z"/>
