  </g>

  <text x="80" y="112" font-size="46" font-weight="600" fill="#2B1F1A">How data flows</text>
  <text x="80" y="156" font-size="22" fill="#7A6A5C">Read only, computed on the device. Nothing leaves the phone unless you opt in.</text>

