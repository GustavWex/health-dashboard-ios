name: HealthDashboard
options:
  bundleIdPrefix: dk.gustavwex
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HealthCore:
    path: HealthCore
targets:
  HealthDashboard:
    type: application
    platform: iOS
    sources:
      - HealthDashboard
      - Shared
    dependencies:
      - package: HealthCore
      - target: HealthWidget
      - target: HealthWatch
    entitlements:
      path: Config/HealthDashboard.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.dk.gustavwex.HealthDashboard]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Config/Info.plist
      properties:
        WithingsClientID: $(WITHINGS_CLIENT_ID)
        WithingsClientSecret: $(WITHINGS_CLIENT_SECRET)
        CFBundleDisplayName: Health
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Reads your health data to show recovery, sleep, training and body trends. Nothing leaves your phone unless you turn on Ask your data.
        NSLocalNetworkUsageDescription: Lets Ask your data reach a model running on your own Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.gustavwex.HealthDashboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 95UZ4964UV
        GENERATE_INFOPLIST_FILE: NO
  HealthWidget:
    type: app-extension
    platform: iOS
    sources:
      - HealthWidget
      - Shared
    entitlements:
      path: Config/HealthWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.gustavwex.HealthDashboard]
    info:
      path: Config/HealthWidget-Info.plist
      properties:
        CFBundleDisplayName: Health
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.gustavwex.HealthDashboard.Widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 95UZ4964UV
        GENERATE_INFOPLIST_FILE: NO
  HealthWatch:
    type: application
    platform: watchOS
    sources:
      - HealthWatch
      - Shared
    dependencies:
      - target: HealthWatchWidget
      - package: HealthCore
    entitlements:
      path: Config/HealthWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.gustavwex.HealthDashboard]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Config/HealthWatch-Info.plist
      properties:
        CFBundleDisplayName: Health
        WKBackgroundModes: [smart-alarm, workout-processing]
        NSMotionUsageDescription: Senses how much you move during the smart alarm window, naps and desk mode, to wake you in light sleep or nudge you if you nod off.
        NSHealthShareUsageDescription: Reads your heart rate in desk mode to notice when you start nodding off.
        NSHealthUpdateUsageDescription: Desk mode runs as a workout session to keep reading heart rate; it is discarded and never saved.
        WKApplication: true
        WKCompanionAppBundleIdentifier: dk.gustavwex.HealthDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.gustavwex.HealthDashboard.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 95UZ4964UV
        GENERATE_INFOPLIST_FILE: NO
  HealthWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - HealthWatchWidget
      - Shared
    entitlements:
      path: Config/HealthWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.gustavwex.HealthDashboard]
    info:
      path: Config/HealthWatchWidget-Info.plist
      properties:
        CFBundleDisplayName: Health
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.gustavwex.HealthDashboard.watchkitapp.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 95UZ4964UV
        GENERATE_INFOPLIST_FILE: NO
schemes:
  HealthWatch:
    build:
      targets:
        HealthWatch: all
  HealthDashboard:
    build:
      targets:
        HealthDashboard: all
